name: Documentation request
description: Report missing, unclear, or inaccurate project documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: File or section
      description: Link the page or name the section.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested correction
    validations:
      required: false
