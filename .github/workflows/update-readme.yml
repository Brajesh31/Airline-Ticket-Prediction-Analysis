name: Validate notebook

on:
  push:
    branches: [main]
    paths:
      - 'PDS_PROJECT.ipynb'
      - '.github/workflows/update-readme.yml'
  pull_request:
    paths:
      - 'PDS_PROJECT.ipynb'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate notebook JSON
        run: python -c "import json; json.load(open('PDS_PROJECT.ipynb', encoding='utf-8')); print('Notebook JSON is valid')"
